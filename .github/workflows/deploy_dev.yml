name: Docker CI/CD Pipeline

# Xác định sự kiện trigger cho pipeline, trong trường hợp này là push lên nhánh develop
on:
  push:
    branches:
      - develop

# Định nghĩa các jobs cần thực hiện
jobs:
   # Job 1: build và test
   # Job thực thi trên máy ảo ubuntu
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        # Sử dụng action "checkout" để sao copy code từ repository vào máy ảo Ubuntu
        uses: actions/checkout@v2

      - name: Login to Docker Hub
          # Sử dụng action "docker/login-action" để đăng nhập vào Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        # Build và test image được build ra bằng Docker
        run: |
          docker build -t python-backend .
          docker exec -it python sh -c "python manage.py test"

      - name: Push image to Docker Hub
        uses: docker/build-push-action@v2
        # Sử dụng action "docker/build-push-action" để đẩy image lên Docker Hub
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USER }}/python-backend:${{ github.sha }}

  # Job 2: Deploy
  deploy:
    needs: build_and_test
    runs-on: ubuntu-latest

    steps:
      - name: Debug SSH Key
        run: echo "${{ secrets.SERVER_HOST }}" | base64
      - name: Debug SSH Key
        run: echo "${{ secrets.SERVER_USER }}" | base64
      - name: Debug SSH Key
        run: echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64
      - name: Deploy to server
       # Sử dụng action "appleboy/ssh-action" để triển khai image lên server thông qua SSH
        uses: appleboy/ssh-action@v0.1.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          debug: true
          script: |
            # Pull image mà được push lên DockerHub bên trên
            docker pull ${{ secrets.DOCKERHUB_USER }}/python-backend:${{ github.sha }}

            # Dừng và gỡ bỏ container hiện tại (nếu có)
            docker stop python-backend-container || true
            docker rm python-backend-container || true

            # Chạy container mới với image đã pull về bên trên
            docker run --env-file .env -d -p 8000:8000 --name python-backend-container ${{ secrets.DOCKERHUB_USER }}/python-backend:${{ github.sha }}
